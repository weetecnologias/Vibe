<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C8005A}a:hover{color:#E80069}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;color:#17151B;display:flex;flex-direction:column;overflow:hidden">
<div style="height:500px;flex:none;background:#17151B;border-radius:0 0 32px 32px;position:relative;overflow:hidden;padding:56px 24px 0;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-family:Sora,sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.04em;color:#E80069">VIBE</span>
<a href="Login.dc.html" style="color:rgba(255,255,255,0.8);font-size:15px;font-weight:600;text-decoration:none;padding:10px 4px">Skip</a>
</div>
<div style="margin-top:36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<span style="width:64px;height:64px;border-radius:20px;background:{{c.bg}};display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
</span>
<span style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.78)">{{c.label}}</span>
</div>
</sc-for>
</div>
<div style="position:absolute;left:24px;right:24px;bottom:28px;background:#FFFFFF;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center">
<div style="width:56px;height:56px;border-radius:14px;flex:none;background-color:#17151B;background-image:radial-gradient(circle at 70% 30%,rgba(232,0,105,0.45),rgba(232,0,105,0) 60%)"></div>
<div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0">
<strong style="font-size:15px">Brew &amp; Bloom Café</strong>
<span style="font-size:12px;color:#69646E">Café · Banjara Hills · 0.8 km</span>
</div>
<span style="padding:5px 9px;border-radius:999px;background:#FDE6F0;color:#C8005A;font-size:11px;font-weight:700">20% OFF</span>
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;padding:32px 28px 40px;gap:14px">
<div style="display:flex;gap:6px" aria-label="Step 1 of 3">
<span style="width:24px;height:8px;border-radius:999px;background:#E80069"></span>
<span style="width:8px;height:8px;border-radius:999px;background:#E9E6EC"></span>
<span style="width:8px;height:8px;border-radius:999px;background:#E9E6EC"></span>
</div>
<h1 style="margin:6px 0 0;font-family:Sora,sans-serif;font-weight:700;font-size:30px;line-height:36px;letter-spacing:-0.02em">Discover Hyderabad’s best</h1>
<p style="margin:0;font-size:15px;line-height:23px;color:#69646E">From Jubilee Hills cafés to Old City food walks: restaurants, studios, salons and experiences, curated in one place.</p>
<span style="flex:1"></span>
<a href="Onboarding2.dc.html" style="height:52px;border-radius:999px;background:#E80069;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center">Next</a>
</div>
</div>
</x-dc>

</body>
</html>
