spring:
  application:
    name: vibe-backend
  datasource:
    url: ${VIBE_DB_URL:jdbc:postgresql://localhost:5432/vibe}
    username: ${VIBE_DB_USER:vibe}
    password: ${VIBE_DB_PASSWORD:vibe}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

vibe:
  security:
    # HS256 signing key for staff (admin and merchant) tokens. Must be at least 32 bytes.
    # Production MUST set VIBE_JWT_SECRET from a secrets manager; the dev default only works with the `dev` profile.
    jwt-secret: ${VIBE_JWT_SECRET:}
    token-minutes: 480
    # Customers renew with a refresh token; the app signs them in again when it expires.
    customer-token-minutes: 1440
  cors:
    # Dashboards in development. Set explicit origins in staging and production.
    allowed-origins: ${VIBE_CORS_ORIGINS:http://localhost:5180,http://localhost:5181}
  media:
    # Development keeps uploads on disk. Production uses object storage behind a CDN.
    dir: ${VIBE_MEDIA_DIR:./data/media}
    public-base-url: ${VIBE_PUBLIC_URL:http://localhost:${server.port}}
  billing:
    # How long a redemption waits for the merchant to raise the bill, and how long a raised bill can be paid.
    redemption-minutes: 30
    bill-minutes: 15
    # Bills at or above this need the merchant to confirm the amount (paise).
    large-bill: 5000000
    # Added to every bill (paise). VIBE's fee model is a business decision; none until it is settled.
    vibe-fee: 0
    # VIBE's fee on each court or class booking and venue membership (paise), shown to the customer at checkout. A business decision: 0 = none.
    booking-fee: ${VIBE_BOOKING_FEE:0}
  payments:
    # Signs webhooks from the payment partner. Webhooks are refused until this is set.
    webhook-secret: ${VIBE_WEBHOOK_SECRET:}
  dev:
    # Dev seed accounts. Used only when the `dev` profile is active; never load in production.
    seed-password: ${VIBE_DEV_PASSWORD:vibe-dev-only}
