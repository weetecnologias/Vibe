vibe:
  security:
    # Development only. Never use this key outside your machine.
    jwt-secret: ${VIBE_JWT_SECRET:dev-only-signing-key-change-me-32-bytes!!}
  cors:
    # Any local port, so the dashboards work wherever the dev server lands.
    allowed-origins: http://localhost:*
  payments:
    # Development only.
    webhook-secret: ${VIBE_WEBHOOK_SECRET:dev-only-webhook-secret-do-not-use}
    # The simulated payment partner confirms a payment this long after it starts.
    simulate-after-ms: 1800
