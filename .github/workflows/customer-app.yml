name: Customer app

on:
  pull_request:
    branches: [main, develop]
    paths: ['apps/customer/**', '.github/workflows/customer-app.yml']
  push:
    branches: [main, develop]
    paths: ['apps/customer/**', '.github/workflows/customer-app.yml']

permissions:
  contents: read

concurrency:
  group: customer-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
