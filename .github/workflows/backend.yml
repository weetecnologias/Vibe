name: Backend

on:
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Tests start a real PostgreSQL in Docker (Testcontainers); Docker is built into the runner.
      - run: mvn -B verify
