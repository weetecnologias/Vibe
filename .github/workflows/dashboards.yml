name: Dashboards

on:
  pull_request:
    branches: [main, develop]
    paths: ['apps/admin/**', 'apps/merchant/**', 'packages/backoffice-kit/**', '.github/workflows/dashboards.yml']
  push:
    branches: [main, develop]
    paths: ['apps/admin/**', 'apps/merchant/**', 'packages/backoffice-kit/**', '.github/workflows/dashboards.yml']

permissions:
  contents: read

concurrency:
  group: dashboards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.app }}: typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [admin, merchant]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
